<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Business Bodhisattva</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A41;--gold:#C8892E;--paper:#F5F1E8;--stone:#6B6559;
--serif:"Source Serif 4",Georgia,serif;--sans:"Inter",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:17px;line-height:1.75;
-webkit-font-smoothing:antialiased;padding:28px}
.box{max-width:520px}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,5vw,40px);line-height:1.28;margin:0 0 14px;letter-spacing:-.01em}
p{color:#B9C2CE;margin:0 0 28px}
a.ghost{display:inline-block;border:1px solid var(--gold);color:var(--gold);text-decoration:none;
font-size:17px;padding:14px 32px;border-radius:5px;transition:background .15s ease,color .15s ease}
a.ghost:hover{background:var(--gold);color:#3A2708}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <h1>This page went off plan.</h1>
    <p>The page you were looking for isn't here. Never let a crisis go to waste — head back to the start.</p>
    <a class="ghost" href="/">Return home</a>
  </div>
</body>
</html>
